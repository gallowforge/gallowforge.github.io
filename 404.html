<script>
  // Ledger was renamed Ballast: send every old address (/ledger/home/, /ledger/about/, ...) to the same page there.
  if (/^\/ledger(\/|$)/.test(location.pathname))
    location.replace('/ballast/' + location.pathname.replace(/^\/ledger\/?/, '') + location.search + location.hash);
  // The page keeps the theme chosen on the portfolio.
  try { if (localStorage.getItem('portfolio:theme') === 'light') { document.documentElement.setAttribute('data-theme', 'light'); document.querySelector('meta[name="color-scheme"]').content = 'light'; document.querySelector('meta[name="theme-color"]').content = '#f6f7f9'; } } catch (e) {}
</script>
<style>

  :root { color-scheme: dark; --bg: #07090c; --ink: #f3f5f8; --muted: #818a98; --line: rgba(196, 210, 232, .17); --tint: rgba(196, 210, 232, .06); }
  :root[data-theme="light"] { color-scheme: light; --bg: #f6f7f9; --ink: #0b0e13; --muted: #5a6370; --line: rgba(16, 24, 40, .2); --tint: rgba(16, 24, 40, .05); }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px max(20px, env(safe-area-inset-right)) 24px max(20px, env(safe-area-inset-left)); background: var(--bg); color: var(--ink); font: 400 16px/1.5 "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  main { display: grid; justify-items: start; gap: 22px; max-width: 30rem; }

  h1 { margin: 0; font-size: clamp(34px, 8vw, 52px); line-height: 1.02; letter-spacing: -.04em; font-weight: 620; text-wrap: balance; }
  h1 span { color: var(--muted); }
